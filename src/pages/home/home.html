<ion-header>
    <ion-navbar color="primary">
        <ion-row>
            <!-- <ion-col col-sm-11 col-md-11 col-lg-11 col-xl-10 class="span_title" style="float: left;   
              display: flex;
              flex-direction: row;
              align-items: center;
              padding-top: 6px;"> مطعم حول العالم</ion-col> -->

            <ion-col col-8 col-sm-8 col-md-8 col-lg-8 col-xl-8 class="span_title" style="float: left;   
              display: flex;
              flex-direction: row;
              align-items: center;
              padding-top: 6px;">Villa Rosa</ion-col>

            <ion-col col-4 col-sm-4 col-md-4 col-lg-4 col-xl-4 style="float: right;">
                <ion-select interface="popover" style=" float: right; max-width: 100% !important;color: #f5f5f5;">
                    <ion-option value="ar" selected="true" (ionSelect)="Show_item('ar')">AR</ion-option>
                    <ion-option value="en" (ionSelect)="Show_item('en')">EN</ion-option>
                </ion-select>
            </ion-col>
        </ion-row>
    </ion-navbar>

    <ion-navbar>
        <ion-scroll scrollX style="height:50px;">
            <div class="scroll-item">
                <ion-col col-33 class=" p_hover" *ngFor="let item of menu$ | async" (click)="onClick(item.name)">
                    <div class="upper_toolbar p_hover">
                        <p style="font-size: 20px;">{{item.name}}</p>
                    </div>
                </ion-col>
            </div>
        </ion-scroll>
    </ion-navbar>

</ion-header>

<ion-content fullscreen style="background-color: #f5f5f5;" class="card-background-page">

    <!-- <button class="btn" ion-button full (click)="add_to_home($event)" *ngIf="showBtn" hideWhen="ios,android">انشاء
    اختصار</button> -->

    <!-- <button class="btn" ion-button full (click)="add_to_home($event)" *ngIf="showBtn" >انشاء
      اختصار</button> -->


    <ion-grid>
        <ion-row>

            <ion-col *ngFor="let item of array_in_observable" class="col-50" col-6 col-xs-12 col-sm-6 col-md-3 col-lg-3 col-xl-3 no-padding>


                <div *ngIf="lang" style="float:right;width: 100%" (click)="open_image(item)">

                    <ion-card class="card_all" [ngClass]="{'card_ios': (paltform_type=='ios'),'card_all': (paltform_type=='all')}">

                        <!-- <img class=item-avatar [defaultImage]="defaultImage" [lazyLoad]="item.image" /> -->
                        <img class=item-avatar src={{item.image}} />

                        <div class="card-title">
                            <ion-col>
                                {{ item.Description_AR }}
                            </ion-col>
                            <div class="card-sub">
                                <ion-col>
                                    <ion-col style="margin-right: -7px">ريال
                                    </ion-col>
                                    <ion-col style="width: auto;">
                                        <div class="card-subtitle">{{item.Price1}}
                                        </div>
                                    </ion-col>
                                </ion-col>
                            </div>
                        </div>

                    </ion-card>


                </div>

                <div *ngIf="!lang" style="float:left;width: 100%" (click)="open_image(item)">
                    <ion-card class="card_all" [ngClass]="{'card_ios': (paltform_type=='ios'),'card_all': (paltform_type=='all')}">
                        <img class=item-avatar [defaultImage]="defaultImage" [lazyLoad]="item.image" />
                        <div class="card-title">
                            <ion-col>
                                {{ item.Description_EN }}
                            </ion-col>
                            <div class="card-sub">
                                <ion-col>
                                    <ion-col style="margin-left: -7px">R.S
                                    </ion-col>
                                    <ion-col style="width: auto;">
                                        <div class="card-subtitle">{{item.Price1}}
                                        </div>
                                    </ion-col>
                                </ion-col>
                            </div>
                        </div>
                    </ion-card>
                </div>



            </ion-col>


        </ion-row>
    </ion-grid>


    <!-- navPush="FullScreenPage" -->
    <!-- <button ion-button (click)="onClick('hhh')">dskdskdflkelf</button> -->
</ion-content>
